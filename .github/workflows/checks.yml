name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./core/... ./cmd/...
      - name: AWG parser fuzz (bounded)
        run: go test -run=^$ -fuzz=^FuzzParseAmneziaWG$ -fuzztime=60s -parallel=2 ./core/profile/amneziawg
      - name: Packaging regression tests
        run: |
          python3 -m unittest discover -s scripts/ios/tests -v
          python3 -m unittest discover -s scripts/android -p 'test_native_pages.py' -v
          python3 -m unittest discover -s scripts/linux/tests -v

  windows-go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test -timeout=90s ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Parse PowerShell build scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test --reporter expanded
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flutter-golden-differences
          path: app/test/failures
          if-no-files-found: ignore
